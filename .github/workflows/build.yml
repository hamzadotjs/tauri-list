name: Build Tauri List
on:
  push:
    branches:
      - master
jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            command: 'build'
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            arch: 'macos-aarch64'
            rust_targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            command: 'build'
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            arch: 'macos-x86_64'
            rust_targets: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            command: 'build'
            args: '--bundles appimage,deb'
            arch: 'linux-x86_64'
            rust_targets: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            command: 'build'
            args: '--bundles nsis,msi'
            arch: 'windows-x86_64'
            rust_targets: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            command: 'android'
            args: 'build --apk'
            arch: 'android'
            rust_targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'
          - platform: 'macos-latest'
            command: 'ios'
            args: 'build'
            arch: 'ios'
            rust_targets: 'aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - if: matrix.arch == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - if: matrix.arch == 'android'
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - if: matrix.platform == 'ubuntu-22.04' && matrix.command == 'build'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm install
      - if: matrix.command == 'android' || matrix.command == 'ios'
        run: npx @tauri-apps/cli ${{ matrix.command }} init
      - run: npx @tauri-apps/cli ${{ matrix.command }} ${{ matrix.args }}
      - if: matrix.arch == 'linux-x86_64'
        run: |
          cd src-tauri/target/release
          find . -maxdepth 1 -type f -executable -exec tar -czf bundle/linux-x86_64.tar.gz {} + || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ matrix.arch }}
          path: |
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app
            src-tauri/target/**/bundle/**/*.tar.gz
            src-tauri/gen/android/**/build/**/*.apk
            src-tauri/gen/ios/**/*.ipa
          if-no-files-found: error
